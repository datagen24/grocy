# The differential test suite, on every pull request.
#
# What this gates is the one thing this fork can most easily break without noticing:
# that the application behaves identically on SQLite and PostgreSQL. A view that quietly
# returns different rows on one engine is invisible in review and obvious here.
#
# Deliberately not built on the repository's Dockerfile. That image exists so a
# contributor can run the suite locally without installing PHP and PostgreSQL by hand;
# CI already has both, and building an image on every pull request would add minutes to
# the feedback loop for no extra coverage. Both paths run the same runner script, so
# there is one definition of what "the suite" means.

name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # There is no configured linter in this repository, so this is a syntax sweep
      # rather than a style check. It is cheap and it catches the parse error that
      # would otherwise fail every job below with a much less obvious message.
      # php -l writes both its success line and its parse errors to stdout, so the
      # output is captured rather than discarded: discarding it hides the filename and
      # leaves a failing job showing nothing but an exit code.
      - name: Check PHP syntax
        run: |
          if ! find . -name '*.php' \
              -not -path './packages/*' \
              -not -path './public/packages/*' \
              -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors detected' lint.log
            exit 1
          fi

  suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: victual
          POSTGRES_PASSWORD: victual
          POSTGRES_DB: victual
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U victual"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.4 is the fork's real language floor. composer.json still declares 8.5 until
      # 15-C7 lowers it, which is why the install below ignores the platform
      # requirement; once that lands, the flag can go.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          # pcov rather than the default none, so the run below can report what the
          # suite reached. It only collects when a process asks it to.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --ignore-platform-req=php

      # The workflow calls the same entry point a contributor runs locally, rather than
      # restating the commands. A suite that drifts from the one people run by hand is
      # a suite nobody trusts.
      #
      # Coverage is measured but nothing is gated on it. What the suite reaches is
      # worth seeing in the log of every run — it is how a phase that silently stopped
      # exercising something gets noticed — but a threshold nobody has chosen would
      # only ever be tuned until it stopped failing.
      - name: Run the differential test suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: victual
          PGPASSWORD: victual
          SUITE_COVERAGE: 1
          SUITE_COVERAGE_CLOVER: clover.xml
        run: .devtools/pgsql/run-tests.sh

      # Uploaded even when the suite fails: which code a failing run did and did not
      # reach is part of reading the failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: warn

  # Sweep finding S29 - the stored-XSS class plan 12 closed - proved with the payload on
  # every pull request rather than once, by hand, on the day it was fixed. A fix nobody
  # re-checks is a fix that comes back: the finding was already re-opened once in review,
  # by a sink (`recipeform.js`'s ingredient note) that the by-hand sweep missed.
  #
  # It boots in SQLite demo mode, and that is a dated choice, not a preference.
  # ADR-0008 is Accepted, so PostgreSQL is the sole runtime engine by decision - but that
  # record says the retirement work is not yet scheduled, `DB_DRIVER` still accepts
  # `sqlite`, and demo mode is what .agents/skills/run-app/SKILL.md and the whole
  # .devtools/frontend harness are written against. What this job asserts is a fact about
  # the *browser*: the engine underneath serves the same pages either way. When the
  # retirement lands, this job moves with the harness rather than ahead of it.
  frontend-security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 8.5 rather than the suite's 8.4: this job *boots the application*, and
      # helpers/PrerequisiteChecker.php hard-fails below REQUIRED_PHP_VERSION ('8.5.0').
      # That is also what composer.json declares, so no --ignore-platform-req is needed.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, gd, intl, zip, mbstring, fileinfo, ctype, zlib

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      # The views load their CSS and JS from /packages/..., and .yarnrc already points
      # yarn at public/packages. Without this the pages boot unstyled and with no bootbox
      # and no toastr at all - which is to say, with none of the sinks under test.
      - name: Install frontend packages
        run: yarn install --frozen-lockfile

      - name: Install the probe harness
        working-directory: .devtools/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A throwaway data directory, exactly as .agents/skills/run-app/SKILL.md describes.
      # The probe leaves its seeded records behind by design, so the database it runs
      # against has to be disposable.
      - name: Boot a demo instance
        run: |
          VDATA=$(mktemp -d)
          cp config-dist.php "$VDATA/config.php"
          VICTUAL_MODE=demo VICTUAL_DATAPATH="$VDATA" \
            nohup php -S 127.0.0.1:8500 -t public > server.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8500/ || true)
            if [ "$code" != "000" ]; then echo "booted, GET / -> $code"; exit 0; fi
            sleep 1
          done
          echo "the instance never answered"; cat server.log; exit 1

      # Exits non-zero if any probe is not clean, and treats "the sink was never reached"
      # and "the action threw" as failures rather than skips - so a run in which nothing
      # happened cannot report success.
      - name: Prove S29 stays closed
        working-directory: .devtools/frontend
        run: node s29-payload.js --url http://127.0.0.1:8500 --out s29-payload.json

      # Uploaded even when the probe fails: which probe went red, and what the payload
      # actually rendered as, is the whole of reading the failure. The server log goes
      # with it because a failure that is really a 500 looks like a missing sink here.
      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s29-payload
          path: |
            .devtools/frontend/s29-payload.json
            server.log
          if-no-files-found: warn
