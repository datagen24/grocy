# The differential test suite, on every pull request.
#
# What this gates is the one thing this fork can most easily break without noticing:
# that the application behaves identically on SQLite and PostgreSQL. A view that quietly
# returns different rows on one engine is invisible in review and obvious here.
#
# Deliberately not built on the repository's Dockerfile. That image exists so a
# contributor can run the suite locally without installing PHP and PostgreSQL by hand;
# CI already has both, and building an image on every pull request would add minutes to
# the feedback loop for no extra coverage. Both paths run the same runner script, so
# there is one definition of what "the suite" means.

name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # There is no configured linter in this repository, so this is a syntax sweep
      # rather than a style check. It is cheap and it catches the parse error that
      # would otherwise fail every job below with a much less obvious message.
      # php -l writes both its success line and its parse errors to stdout, so the
      # output is captured rather than discarded: discarding it hides the filename and
      # leaves a failing job showing nothing but an exit code.
      - name: Check PHP syntax
        run: |
          if ! find . -name '*.php' \
              -not -path './packages/*' \
              -not -path './public/packages/*' \
              -print0 \
            | xargs -0 -n1 -P4 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors detected' lint.log
            exit 1
          fi

  suite:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocy
          POSTGRES_PASSWORD: grocy
          POSTGRES_DB: grocy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # 8.4 is the fork's real language floor. composer.json still declares 8.5 until
      # 15-C7 lowers it, which is why the install below ignores the platform
      # requirement; once that lands, the flag can go.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_pgsql, gd, intl, zip, mbstring, fileinfo, ctype
          # pcov rather than the default none, so the run below can report what the
          # suite reached. It only collects when a process asks it to.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: packages
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts --ignore-platform-req=php

      # The workflow calls the same entry point a contributor runs locally, rather than
      # restating the commands. A suite that drifts from the one people run by hand is
      # a suite nobody trusts.
      #
      # Coverage is measured but nothing is gated on it. What the suite reaches is
      # worth seeing in the log of every run — it is how a phase that silently stopped
      # exercising something gets noticed — but a threshold nobody has chosen would
      # only ever be tuned until it stopped failing.
      - name: Run the differential test suite
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: grocy
          PGPASSWORD: grocy
          SUITE_COVERAGE: 1
          SUITE_COVERAGE_CLOVER: clover.xml
        run: .devtools/pgsql/run-tests.sh

      # Uploaded even when the suite fails: which code a failing run did and did not
      # reach is part of reading the failure.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: clover.xml
          if-no-files-found: warn
