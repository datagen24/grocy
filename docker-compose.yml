# Development and CI environment for the differential test suite.
#
#   docker compose run --rm dev .devtools/pgsql/run-difftests.sh
#
# The `dev` service mounts the working tree over /app so edits are picked up without a
# rebuild, while keeping the image's `packages/` (composer output) — that directory is
# gitignored and does not exist on the host.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: grocy
      POSTGRES_PASSWORD: grocy
      POSTGRES_DB: grocy
    # No persistent volume on purpose: every run of the suite should start from a
    # database it created itself. A stale volume is how a passing suite starts lying.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocy -d grocy"]
      interval: 2s
      timeout: 3s
      retries: 30

  dev:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      # Keep the image's vendor directory rather than shadowing it with the host's
      # (absent) one.
      - /app/packages
      # Scratch space for the databases the suite builds and throws away.
      - suite-scratch:/scratch
    environment:
      GROCY_ROOT: /app

      # difftest.php's namespace.
      DIFFTEST_SQLITE_DSN: sqlite:/scratch/difftest.db
      DIFFTEST_PGSQL_DSN: pgsql:host=postgres;port=5432;dbname=grocy_full
      DIFFTEST_PGSQL_USER: grocy
      DIFFTEST_PGSQL_PASSWORD: grocy

      # trigdifftest.php's namespace, which is disjoint from the above and has to be
      # set separately. TRIGTEST_PRISTINE_PATH is produced by bin/grocy-migrate.
      TRIGTEST_SQLITE_PATH: /scratch/trigtest.db
      TRIGTEST_PRISTINE_PATH: /scratch/pristine.db
      TRIGTEST_PGSQL_DSN: pgsql:host=postgres;port=5432;dbname=grocy_trig
      TRIGTEST_PGSQL_USER: grocy
      TRIGTEST_PGSQL_PASSWORD: grocy
    working_dir: /app

volumes:
  suite-scratch:
