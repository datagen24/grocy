# Victual, as one pod: seed the data directory, migrate, then serve.
#
# This targets the production image the `Dockerfile`'s `production` stage builds — Apache
# with mod_php, `www-data`, port 8080 — and it is a Kubernetes object rather than a
# compose file so that `podman kube play` on a laptop and k3s in the cluster describe the
# deployment the same way. One manifest instead of two.
#
#   podman kube play deploy/podman/victual.yaml
#   podman kube down deploy/podman/victual.yaml
#
# PostgreSQL is not in here. Per ADR-0010's boundary — the fork declares what its
# workloads need, the operator decides where they run — the database is the operator's,
# and deploy/README.md says how to stand a throwaway one up.
#
# Status: written against the image the `images` CI job builds and asserts, but this
# manifest has not itself been run. See docs/plans/20-deploy-tree.md, "Verification".
apiVersion: v1
kind: Pod
metadata:
  name: victual
  labels:
    app.kubernetes.io/name: victual
spec:
  restartPolicy: Always

  securityContext:
    runAsNonRoot: true
    # www-data is uid/gid 33 on Debian, which is what the image runs as.
    runAsUser: 33
    runAsGroup: 33
    # Without this the emptyDir volumes below are root:root 0755 and uid 33 cannot write
    # to them. It is the single most common reason a correctly built non-root image fails
    # to start; the CI check that exercises this image passes `uid=33,gid=33` to its
    # tmpfs mounts for the same reason.
    fsGroup: 33
    seccompProfile:
      type: RuntimeDefault

  # Exactly the three paths the Dockerfile names as writable, and nothing else. The
  # image's own header is the authority on this list; verification 4 of plan 10 is what
  # keeps it honest.
  volumes:
    # config.php is read from here, and uploaded files are written here when file storage
    # is on disk rather than in the database. In-memory means no durable state outside
    # PostgreSQL — see deploy/README.md before turning on file attachments.
    - name: data
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    # PHP's temporary directory: thumbnail re-encoding, DatabaseStorage's spill over
    # 2 MiB, and multipart uploads.
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    # Apache's pid file. apache2-foreground removes it at startup and apache2 writes it.
    - name: apache-run
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi

  initContainers:
    # `PrerequisiteChecker::checkForConfigFile` refuses to start unless config.php exists
    # inside VICTUAL_DATAPATH, and /data is a fresh emptyDir on every start. The image
    # does not seed it, so this does — the same copy the `images` CI job makes before it
    # can serve a request.
    #
    # Every actual setting arrives as a VICTUAL_* environment variable, which
    # config-dist.php's Setting() already prefers over its own defaults, so the copied
    # file needs no edits. A household that would rather keep a real config.php can mount
    # one over /data/config.php instead and drop this container; `cp -n` is deliberate so
    # that a mounted file is never overwritten.
    - name: seed-config
      image: localhost/victual:production
      imagePullPolicy: Never
      command: ["sh", "-c", "cp -n /app/config-dist.php /data/config.php"]
      volumeMounts:
        - name: data
          mountPath: /data
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Since plan 10, nothing migrates inside a request and the application answers 503
    # until the schema matches the code. Migrating here is what turns that from a failure
    # mode into a startup step: bin/victual-migrate is a no-op against an up-to-date
    # database and exits non-zero on failure, so a bad migration keeps the pod from
    # starting rather than letting it start and fail per request.
    - name: migrate
      image: localhost/victual:production
      imagePullPolicy: Never
      command: ["php", "/app/bin/victual-migrate"]
      envFrom:
        - configMapRef:
            name: victual-config
        - secretRef:
            name: victual-secrets
      volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

  containers:
    - name: victual
      image: localhost/victual:production
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 8080
          hostPort: 8080
      envFrom:
        - configMapRef:
            name: victual-config
        - secretRef:
            name: victual-secrets
      volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: apache-run
          mountPath: /var/run/apache2
      securityContext:
        # The image is built to run this way and CI asserts that it does. If this has to
        # be turned off to get a green pod, something wrote where it should not have, and
        # that is a finding rather than a workaround.
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]

      # robots.txt is served by Apache without involving PHP, so this proves the server
      # is up and its document root is mounted, and nothing more.
      startupProbe:
        httpGet:
          path: /robots.txt
          port: 8080
        periodSeconds: 2
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /robots.txt
          port: 8080
        periodSeconds: 10

      # Readiness goes through the whole stack: Apache, mod_php, Blade, the database.
      # /login rather than /api/system/info because that one needs an API key, and rather
      # than /robots.txt because a static file proves none of it. It is also what reports
      # the schema gate: SchemaVersionMiddleware answers 503 until the database matches
      # the code, so a pod whose migration has not finished is correctly not ready.
      readinessProbe:
        httpGet:
          path: /login
          port: 8080
        periodSeconds: 5
        failureThreshold: 6

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

      # Apache treats SIGWINCH as "stop accepting, finish what you have". Kubernetes
      # ignores an image's StopSignal and sends SIGTERM unless the container says
      # otherwise; on a cluster too old for this field the pod gets SIGTERM, which Apache
      # takes as "stop now" — acceptable for a stateless request handler, but not the
      # same thing, and worth knowing before wondering where a truncated request went.
      lifecycle:
        stopSignal: SIGWINCH
